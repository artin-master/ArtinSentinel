name: Validate Artin Sentinel 0.2.94.38

concurrency:
  group: sentinel-0.2.94.38-final
  cancel-in-progress: true

on:
  push:
    branches:
      - "feature/0.2.94.38-equipment-onboarding"
      - "release/0.2.94.38"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System media runtime
        run: |
          command -v ffmpeg
          command -v ffprobe
          command -v ffplay
          ffmpeg -hide_banner -version | head -n 1

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"

      - name: Version, syntax and install check
        run: |
          python -m pytest -q tests/test_version_consistency.py
          python -m compileall -q artin_sentinel artin_akdb
          bash -n install.sh
          bash -n run-sentinel.sh
          ./install.sh --check --minimal
          git diff --check

      - name: Equipment 2.0 and secure-transfer regression
        run: |
          python -m pytest -q \
            tests/test_secure_transfer_029438.py \
            tests/test_equipment_policy_029438.py \
            tests/test_equipment_connection_029438.py \
            tests/test_equipment_editor_029438.py \
            tests/test_import_onboarding_029433.py \
            tests/test_selective_transfer_029427.py \
            tests/test_transfer_ui_029427.py \
            tests/test_config_portability_0286.py

      - name: Hikvision affected regression
        run: |
          python -m pytest -q \
            tests/test_hikvision_hardening_029433.py \
            tests/test_hikvision_recording_pilot_0270.py \
            tests/test_hik_playback_029428.py \
            tests/test_hik_review_029429.py \
            tests/test_hik_sdk_029431.py \
            tests/test_recording_export_0262.py

      - name: Intelbras source preservation
        run: |
          git diff --exit-code 448556a8dd66a7f852494425d32f45bf946f450d -- \
            artin_sentinel/intelbras_cloud.py \
            artin_sentinel/intelbras_cloud_recordings.py \
            artin_sentinel/intelbras_local_playback.py \
            artin_sentinel/intelbras_netsdk.py

      - name: Broad suite excluding verified 0.2.94.32 baseline debt
        run: |
          python -m pytest -q \
            --deselect 'tests/test_device_intelligence_0214.py::test_hikvision_rtsp_failure_reports_when_isapi_validated_password' \
            --deselect 'tests/test_playback_acceleration_029421.py::test_cloud_speed_command_reaches_native_sdk_without_live_network' \
            --deselect 'tests/test_playback_acceleration_029421.py::test_native_acceleration_advances_picture_while_bounding_output_fps' \
            --deselect 'tests/test_playback_acceleration_029421.py::test_rejected_cloud_acceleration_stops_after_one_login' \
            --deselect 'tests/test_playback_small_packets_029410.py::test_playback_small_packets_continue_beyond_initial_seconds' \
            --deselect 'tests/test_recording_history_02946.py::test_burst_sdk_playback_is_paced_at_one_x' \
            --deselect 'tests/test_recording_hotfix_02945.py::test_local_sdk_receives_real_speed_enum[0.5--1]' \
            --deselect 'tests/test_recording_hotfix_02945.py::test_local_sdk_receives_real_speed_enum[2-1]' \
            --deselect 'tests/test_recording_hotfix_02945.py::test_local_sdk_receives_real_speed_enum[4-2]' \
            --deselect 'tests/test_recording_hotfix_02945.py::test_local_sdk_receives_real_speed_enum[8-3]' \
            --deselect 'tests/test_recording_hotfix_02945.py::test_local_sdk_receives_real_speed_enum[16-4]' \
            --deselect 'tests/test_shared_playback_02948.py::test_recording_video_continues_when_audio_starts_and_stops'

      - name: Build wheel
        run: python -m build --wheel

      - name: Build normal installer ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root=Path.cwd()
          version="0.2.94.38"
          target=root/f"ArtinSentinel_{version}_instalacao_completa.zip"
          excluded={".git",".github",".pytest_cache","__pycache__",".venv","build"}
          excluded_suffixes={".pyc",".pyo"}
          files=[]
          for path in root.rglob("*"):
              if not path.is_file() or path==target:
                  continue
              rel=path.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if path.suffix in excluded_suffixes:
                  continue
              files.append((path,rel))
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED) as zf:
              for path,rel in sorted(files,key=lambda item:str(item[1])):
                  zf.write(path,rel.as_posix())
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          (root/f"{target.name}.sha256").write_text(f"{digest}  {target.name}\n",encoding="utf-8")
          print(target.name,target.stat().st_size,digest)
          PY

      - name: Validate ZIP re-extraction
        run: |
          rm -rf /tmp/sentinel-package
          mkdir -p /tmp/sentinel-package
          unzip -q ArtinSentinel_0.2.94.38_instalacao_completa.zip -d /tmp/sentinel-package
          cd /tmp/sentinel-package
          python -m compileall -q artin_sentinel artin_akdb
          bash -n install.sh
          grep -q 'version = "0.2.94.38"' pyproject.toml
          grep -q '__version__ = "0.2.94.38"' artin_sentinel/__init__.py
          grep -q 'NEW_VERSION="0.2.94.38"' install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArtinSentinel-0.2.94.38-installer
          path: |
            ArtinSentinel_0.2.94.38_instalacao_completa.zip
            ArtinSentinel_0.2.94.38_instalacao_completa.zip.sha256
            dist/*.whl
