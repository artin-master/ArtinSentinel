name: Validate Artin Sentinel 0.2.94.33

on:
  push:
    branches:
      - "release/0.2.94.33"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[test]"

      - name: Version and syntax
        run: |
          python -m pytest -q tests/test_version_consistency.py
          python -m compileall -q artin_sentinel artin_akdb
          bash -n install.sh
          bash -n run-sentinel.sh
          ./install.sh --check --minimal
          git diff --check

      - name: Import and Hikvision affected regression
        run: |
          python -m pytest -q             tests/test_import_onboarding_029433.py             tests/test_selective_transfer_029427.py             tests/test_transfer_ui_029427.py             tests/test_config_portability_0286.py             tests/test_hikvision_hardening_029433.py             tests/test_hikvision_recording_pilot_0270.py             tests/test_hik_playback_029428.py             tests/test_hik_review_029429.py             tests/test_hik_sdk_029431.py             tests/test_recording_export_0262.py

      - name: Full automated suite
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Build normal installer ZIP
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root=Path.cwd()
          version="0.2.94.33"
          target=root/f"ArtinSentinel_{version}_instalacao_completa.zip"
          excluded={".git",".github",".pytest_cache","__pycache__",".venv","build"}
          excluded_suffixes={".pyc",".pyo"}
          files=[]
          for path in root.rglob("*"):
              if not path.is_file() or path==target:
                  continue
              rel=path.relative_to(root)
              if any(part in excluded for part in rel.parts):
                  continue
              if path.suffix in excluded_suffixes:
                  continue
              files.append((path,rel))
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED) as zf:
              for path,rel in sorted(files,key=lambda item:str(item[1])):
                  zf.write(path,rel.as_posix())
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          (root/f"{target.name}.sha256").write_text(f"{digest}  {target.name}\n",encoding="utf-8")
          print(target.name,target.stat().st_size,digest)
          PY

      - name: Validate ZIP re-extraction
        run: |
          rm -rf /tmp/sentinel-package
          mkdir -p /tmp/sentinel-package
          unzip -q ArtinSentinel_0.2.94.33_instalacao_completa.zip -d /tmp/sentinel-package
          cd /tmp/sentinel-package
          python -m compileall -q artin_sentinel artin_akdb
          bash -n install.sh
          grep -q 'version = "0.2.94.33"' pyproject.toml
          grep -q '__version__ = "0.2.94.33"' artin_sentinel/__init__.py
          grep -q 'NEW_VERSION="0.2.94.33"' install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ArtinSentinel-0.2.94.33-installer
          path: |
            ArtinSentinel_0.2.94.33_instalacao_completa.zip
            ArtinSentinel_0.2.94.33_instalacao_completa.zip.sha256
            dist/*.whl
