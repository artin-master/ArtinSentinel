[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artin-sentinel"
version = "0.2.95"
description = "Artin Sentinel — multibrand CCTV monitoring and diagnostics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Artin"}]
dependencies = ["PySide6>=6.8", "keyring>=25.6", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
artin-sentinel = "artin_sentinel.app:main"

[tool.setuptools.packages.find]
include = ["artin_sentinel*", "artin_akdb*"]

[tool.setuptools.package-data]
"artin_sentinel.resources" = ["*.png"]
"artin_akdb" = ["*.json"]
